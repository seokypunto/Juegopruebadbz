<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criptomaniakos Tap</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      user-select: none;
    }
    #monedas {
      font-size: 3.5rem;
      font-weight: bold;
      margin-bottom: 20px;
      color: #ffd700;
    }
    .btn-tap {
      background-color: #e53935;
      color: white;
      border: none;
      border-radius: 50%;
      width: 160px;
      height: 160px;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 0 #b71c1c;
    }
    .btn-tap:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #b71c1c;
    }
    /* Ocultamos la consola para que el jugador no la vea */
    #log {
      display: none;
    }
  </style>
</head>
<body>

  <div id="monedas">0</div>
  <button class="btn-tap" onclick="hacerTap()">TAP!</button>

  <div id="log">=== CONSOLA ===</div>

  <script>
    function logger(txt) {
      var elem = document.getElementById('log');
      if (elem) {
        elem.innerHTML += '<br>> ' + txt;
        elem.scrollTop = elem.scrollHeight;
      }
    }

    window.onerror = function(msg, line) {
      logger('ERROR SCRIPT: ' + msg);
      return false;
    };

    logger('Script cargado correctamente.');

    var tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      logger('Telegram SDK activo');
    }

    var usuario = (tg && tg.initDataUnsafe) ? tg.initDataUnsafe.user : null;
    if (usuario) {
      logger('Usuario: ' + usuario.id);
    } else {
      logger('Sin datos de usuario Telegram');
    }

    var SUPABASE_URL = "https://jqxyxznxrfijwvvlzwqn.supabase.co";
    var SUPABASE_KEY = "sb_publishable_pN84HJ_JgrYxWRC4EDq_fA_ges02f51";

    var clientSupabase = null;
    try {
      if (window.supabase) {
        clientSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        logger('Supabase listo');
      }
    } catch(e) {
      logger('Error Supabase: ' + e.message);
    }

    var contador = 0;

    function hacerTap() {
      contador = contador + 1;
      document.getElementById('monedas').innerText = contador;
      logger('Tap pulsado! Valor: ' + contador);

      if (!usuario || !clientSupabase) {
        logger('No se envia a BD (falta usuario o cliente)');
        return;
      }

      clientSupabase
        .from('jugadores')
        .upsert({ 
          telegram_id: usuario.id, 
          username: usuario.username || 'sin_nombre', 
          monedas: contador 
        })
        .then(function(res) {
          if (res.error) {
            logger('Error BD: ' + res.error.message);
          } else {
            logger('¡GUARDADO EN BD!');
          }
        })
        .catch(function(err) {
          logger('Excepcion BD: ' + err.message);
        });
    }
  </script>
</body>
</html>
