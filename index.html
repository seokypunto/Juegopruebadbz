<style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      user-select: none;
    }
    #monedas {
      font-size: 3.5rem;
      font-weight: bold;
      margin-bottom: 20px;
      color: #ffd700;
    }
    .btn-tap {
      background-color: #e53935;
      color: white;
      border: none;
      border-radius: 50%;
      width: 160px;
      height: 160px;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 0 #b71c1c;
      outline: none;
    }
    .btn-tap:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #b71c1c;
    }
    #log {
      margin-top: 25px;
      width: 85%;
      max-width: 380px;
      background: #000;
      color: #00ff00;
      font-family: monospace;
      font-size: 0.75rem;
      padding: 10px;
      border-radius: 8px;
      height: 120px;
      overflow-y: auto;
      border: 1px solid #333;
      text-align: left;
    }
  </style>
