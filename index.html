<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criptomaniakos Tap</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      user-select: none;
    }
    .contador {
      font-size: 3rem;
      font-weight: bold;
      margin-bottom: 20px;
      color: #ffd700;
    }
    button {
      background-color: #e53935;
      color: white;
      border: none;
      border-radius: 50%;
      width: 160px;
      height: 160px;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 0 #b71c1c;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #b71c1c;
    }
    #log {
      margin-top: 25px;
      width: 85%;
      max-width: 380px;
      background: #000;
      color: #00ff00;
      font-family: monospace;
      font-size: 0.75rem;
      padding: 10px;
      border-radius: 8px;
      height: 110px;
      overflow-y: auto;
      border: 1px solid #333;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="contador" id="monedas">0</div>
  <button id="tapBtn">TAP!</button>

  <div id="log">=== DEBUG CONSOLE ===</div>

  <script>
    function logger(mensaje) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += '<br>> ' + mensaje;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    window.onerror = function(msg, url, line) {
      logger('ERROR SCRIPT: ' + msg + ' (Línea ' + line + ')');
      return false;
    };

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      logger('Telegram SDK: OK');
    } else {
      logger('Telegram SDK: NO Detectado');
    }

    const usuario = tg?.initDataUnsafe?.user;
    if (usuario) {
      logger('User: ' + (usuario.username || usuario.first_name) + ' (' + usuario.id + ')');
    } else {
      logger('User: NO detectado en initDataUnsafe');
    }

    const SUPABASE_URL = 'https://TU_PROYECTO.supabase.co'; // Inserta tu URL real si es diferente
    const SUPABASE_KEY = 'TU_KEY_PUBLICA';                   // Inserta tu Key real si es diferente

    let supabase;
    try {
      if (window.supabase) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        logger('Supabase: Cliente creado');
      } else {
        logger('Supabase: CDN no cargado');
      }
    } catch(e) {
      logger('Supabase Init Error: ' + e.message);
    }

    let contador = 0;
    const btn = document.getElementById('tapBtn');
    const displayMonedas = document.getElementById('monedas');

    btn.addEventListener('click', async () => {
      contador++;
      displayMonedas.innerText = contador;
      logger('Tap! Total local: ' + contador);

      if (!usuario) {
        logger('Aviso: No se envía (Falta usuario Telegram)');
        return;
      }

      if (!supabase) {
        logger('Aviso: No se envía (Falta cliente Supabase)');
        return;
      }

      try {
        const { data, error } = await supabase
          .from('jugadores')
          .upsert({ 
            telegram_id: usuario.id, 
            username: usuario.username || 'sin_nombre', 
            monedas: contador 
          });

        if (error) {
          logger('Error Supabase: ' + error.message);
        } else {
          logger('¡Guardado OK en Supabase!');
        }
      } catch (err) {
        logger('Excepción: ' + err.message);
      }
    });
  </script>
</body>
</html>
