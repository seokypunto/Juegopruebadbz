<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criptomaniakos Miner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      user-select: none;
    }
    .titulo {
      font-size: 1rem;
      color: #888;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #monedas {
      font-size: 3.5rem;
      font-weight: bold;
      margin-bottom: 30px;
      color: #ffd700;
    }
    /* Estilo del asset minero */
    .btn-mina {
      background: linear-gradient(135deg, #2a2a2a, #1f1f1f);
      color: white;
      border: 3px solid #444;
      border-radius: 20px;
      width: 200px;
      height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 0 #111;
      transition: transform 0.1s;
      position: relative;
    }
    .btn-mina:active {
      transform: translateY(4px);
      box-shadow: 0 6px 0 #111;
    }
    .icono-mina-img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 10px;
    }
    .texto-estado {
      font-size: 0.9rem;
      font-weight: bold;
      color: #00ffcc;
    }
    /* Barra de progreso */
    .barra-contenedor {
      width: 80%;
      max-width: 250px;
      background: #222;
      border-radius: 10px;
      height: 14px;
      margin-top: 25px;
      overflow: hidden;
      border: 1px solid #444;
    }
    #barraProgreso {
      background: linear-gradient(90deg, #ff9800, #ffeb3b);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    #textoProgreso {
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 8px;
    }
    #log { display: none; }
  </style>
</head>
<body>

  <div class="titulo">Balance Total</div>
  <div id="monedas">0</div>

  <!-- Asset de Vegeta en pantalla -->
  <button class="btn-mina" id="btnMina" onclick="recolectar()">
    <img src="vegeta.png" class="icono-mina-img" alt="Vegeta">
    <div class="texto-estado" id="estadoTexto">Minando...</div>
  </button>

  <!-- Barra de llenado -->
  <div class="barra-contenedor">
    <div id="barraProgreso"></div>
  </div>
  <div id="textoProgreso">Progreso: 0 / 1000</div>

  <div id="log">=== CONSOLA ===</div>

  <script>
    function logger(txt) {
      var elem = document.getElementById('log');
      if (elem) {
        elem.innerHTML += '<br>> ' + txt;
        elem.scrollTop = elem.scrollHeight;
      }
    }

    var tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.expand(); }

    var usuario = (tg && tg.initDataUnsafe) ? tg.initDataUnsafe.user : null;

    var SUPABASE_URL = "https://jqxyxznxrfijwvvlzwqn.supabase.co";
    var SUPABASE_KEY = "sb_publishable_pN84HJ_JgrYxWRC4EDq_fA_ges02f51";

    var clientSupabase = null;
    try {
      if (window.supabase) {
        clientSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch(e) {}

    var monedasTotales = 0;
    var progresoActual = 0;
    var limiteMinado = 1000;

    // Bucle automático de minado (suma 1 al progreso cada 1 segundo)
    setInterval(function() {
      if (progresoActual < limiteMinado) {
        progresoActual++;
        actualizarInterfaz();

        if (progresoActual === limiteMinado) {
          document.getElementById('estadoTexto').innerText = "¡RECLAMAR!";
          document.getElementById('btnMina').style.borderColor = "#ffd700";
        }
      }
    }, 1000);

    function actualizarInterfaz() {
      document.getElementById('barraProgreso').style.width = (progresoActual / limiteMinado) * 100 + '%';
      document.getElementById('textoProgreso').innerText = 'Progreso: ' + progresoActual + ' / ' + limiteMinado;
    }

    // Acción al hacer clic en el asset
    function recolectar() {
      if (progresoActual < limiteMinado) {
        logger('Aún no está lleno, espera a que termine de minar.');
        return;
      }

      monedasTotales += limiteMinado;
      document.getElementById('monedas').innerText = monedasTotales;

      progresoActual = 0;
      document.getElementById('estadoTexto').innerText = "Minando...";
      document.getElementById('btnMina').style.borderColor = "#444";
      actualizarInterfaz();

      logger('¡Recogido! Total: ' + monedasTotales);

      if (!usuario || !clientSupabase) return;

      clientSupabase
        .from('jugadores')
        .upsert({ 
          telegram_id: usuario.id, 
          username: usuario.username || 'sin_nombre', 
          monedas: monedasTotales 
        })
        .then(function(res) {
          if (res.error) logger('Error BD: ' + res.error.message);
        });
    }
  </script>
</body>
</html>
