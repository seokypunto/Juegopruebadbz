<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego - Goku Baby</title>
    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .stats {
            margin: 15px 0;
            font-size: 1.2rem;
        }
        /* Barra de nivel */
        .progress-bar-container {
            width: 100%;
            background-color: #444;
            border-radius: 8px;
            overflow: hidden;
            height: 25px;
            margin: 15px 0;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #ff9900;
            transition: width 0.3s ease;
        }
        button {
            background-color: #ff9900;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #e68a00;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Entrenamiento de Goku Baby</h1>
        
        <div class="stats">
            <p>Nivel: <span id="goku-level">1</span></p>
            <p>XP: <span id="goku-xp">0</span> / 100</p>
        </div>

        <!-- Barra de Nivel -->
        <div class="progress-bar-container">
            <div id="xp-bar" class="progress-bar"></div>
        </div>

        <div class="stats">
            <p>Balance actual: <span id="balance-val">100</span> monedas</p>
        </div>

        <button onclick="entrenar()">¡Entrenar / Ganar XP!</button>
        <button onclick="guardarProgresoEnSupabase()">Guardar en la Nube</button>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE SUPABASE
        // ==========================================
        const SUPABASE_URL = 'https://jqxyxznxrfijwvvlzwqn.supabase.co/rest/v1/'; // Reemplaza con tu URL de Supabase
        const SUPABASE_ANON_KEY = 'sb_publishable_pN84HJ_JgrYxWRC4EDq_fA_ges02f51'; // Reemplaza con tu Key anónima
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ID de usuario de prueba (puedes cambiarlo o adaptarlo al sistema de Telegram/Login)
        const userId = "usuario_test_1"; 

        // Estado del juego
        let gameState = {
            level: 1,
            xp: 0,
            balance: 100
        };

        // Actualizar la interfaz visual del juego
        function actualizarUI() {
            document.getElementById('goku-level').innerText = gameState.level;
            document.getElementById('goku-xp').innerText = gameState.xp;
            document.getElementById('balance-val').innerText = gameState.balance;
            
            // Calcular porcentaje para la barra de nivel (meta de 100 XP por nivel)
            let porcentaje = (gameState.xp / 100) * 100;
            if (porcentaje > 100) porcentaje = 100;
            document.getElementById('xp-bar').style.width = porcentaje + '%';
        }

        // Acción de entrenar (sube XP y balance)
        function entrenar() {
            gameState.xp += 25;
            gameState.balance += 10;

            if (gameState.xp >= 100) {
                gameState.level += 1;
                gameState.xp = 0;
                alert('¡¡Has subido de nivel a Goku Baby!! 🎉');
            }

            actualizarUI();
        }

        // ==========================================
        // FUNCIONES DE SUPABASE (Guardar y Cargar)
        // ==========================================
        async function guardarProgresoEnSupabase() {
            const { data, error } = await _supabase
                .from('goku_progress')
                .upsert({ 
                    user_id: userId, 
                    goku_level: gameState.level, 
                    goku_xp: gameState.xp,
                    balance: { monedas: gameState.balance }, // Guardado estructurado en JSONB
                    updated_at: new Date()
                }, { onConflict: 'user_id' });

            if (error) {
                console.error('Error al guardar en Supabase:', error);
                alert('Hubo un error al guardar el progreso.');
            } else {
                console.log('¡Progreso guardado con éxito!', data);
                alert('¡Progreso guardado en Supabase correctamente!');
            }
        }

        async function cargarProgresoDeSupabase() {
            const { data, error } = await _supabase
                .from('goku_progress')
                .select('*')
                .eq('user_id', userId)
                .single();

            if (error || !data) {
                console.log('No hay datos previos en la base de datos, usando valores por defecto.');
                return;
            }

            // Volcar los datos recuperados al estado del juego
            gameState.level = data.goku_level || 1;
            gameState.xp = data.goku_xp || 0;
            if (data.balance && data.balance.monedas) {
                gameState.balance = data.balance.monedas;
            }

            actualizarUI();
            console.log('¡Progreso de Goku cargado desde Supabase!', data);
        }

        // Cargar los datos automáticamente al abrir la página
        window.onload = function() {
            cargarProgresoDeSupabase();
        };
    </script>
</body>
</html>
