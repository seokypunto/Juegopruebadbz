<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criptomaniakos Tap Game</title>

  <!-- 1. Cargar el "cable de conexión" con Telegram y Supabase -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* 2. EL DISEÑO (CSS): Colores, tamaños y centrado para móvil */
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      user-select: none; /* Evita que se seleccione el texto al hacer muchos clics */
    }

    .contador {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 20px;
      color: #ffd700; /* Color dorado para las monedas */
    }

    .boton-tap {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ff9900, #e67e22);
      border: 4px solid #ffffff;
      font-size: 1.5rem;
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 153, 0, 0.5);
      transition: transform 0.05s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Animación: cuando pulsas con el dedo, se hace un pelín más pequeño */
    .boton-tap:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <!-- LA PANTALLA (HTML): El contador y el botón -->
  <div class="contador">🪙 <span id="puntos">0</span></div>
  <div class="boton-tap" id="btnTap">¡TAP!</div>

  <script>
    // 3. EL CEREBRO (JavaScript)
    
    // Conectamos con el sistema de Telegram
    const tg = window.Telegram.WebApp;
    tg.expand(); // Hace que el juego ocupe toda la pantalla del móvil

    // CONEXIÓN A TU BASE DE DATOS SUPABASE
    // Sustituye estos dos textos por los datos de tu bloc de notas:
    const SUPABASE_URL = "TU_PROJECT_URL_AQUÍ"; 
    const SUPABASE_KEY = "TU_PUBLISHABLE_KEY_AQUÍ";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Cogemos los datos del usuario de Telegram
    const usuario = tg.initDataUnsafe?.user || { id: 12345, username: "ModoPruebas" };
    
    let monedas = 0;
    const elementoPuntos = document.getElementById("puntos");
    const botonTap = document.getElementById("btnTap");

    // Función 1: Buscar si el jugador ya existía en la base de datos
    async function cargarProgreso() {
      const { data } = await supabase
        .from('jugadores')
        .select('monedas')
        .eq('telegram_id', usuario.id)
        .single();

      if (data) {
        monedas = data.monedas;
        elementoPuntos.innerText = monedas;
      } else {
        // Si es la primera vez que entra, lo creamos en Supabase
        await supabase.from('jugadores').insert([
          { telegram_id: usuario.id, username: usuario.username || "SinNombre", monedas: 0 }
        ]);
      }
    }

    // Función 2: Guardar las monedas en Supabase
    async function guardarEnSupabase() {
      await supabase
        .from('jugadores')
        .update({ monedas: monedas })
        .eq('telegram_id', usuario.id);
    }

    // Al hacer clic en el botón: suma 1 moneda y guarda en el servidor
    botonTap.addEventListener("click", () => {
      monedas++;
      elementoPuntos.innerText = monedas;
      guardarEnSupabase(); // Envia la actualización a Supabase
    });

    // Cargar los datos nada más abrir la pantalla
    cargarProgreso();
  </script>
</body>
</html>
