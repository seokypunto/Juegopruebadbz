<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Criptomaniakos Miner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .btn-demo-test {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 0, 85, 0.85);
      color: white;
      border: 1px solid #ff4081;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.65rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .btn-demo-test:active {
      transform: scale(0.95);
    }

    .contenido-principal {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 4px 14px 52px 14px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .titulo {
      font-size: 0.7rem;
      color: #888;
      margin-bottom: 1px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    
    #monedas {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 4px;
      color: #ffd700;
    }

    .nivel-info-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 80%;
      max-width: 240px;
      margin-bottom: 6px;
    }
    .nivel-texto-fila {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.75rem;
      font-weight: bold;
      color: #ff9800;
      margin-bottom: 2px;
      text-transform: uppercase;
    }
    .barra-exp-contenedor {
      width: 100%;
      background: #222;
      border-radius: 6px;
      height: 6px;
      overflow: hidden;
      border: 1px solid #444;
    }
    #barraExp {
      background: linear-gradient(90deg, #ff9800, #ffeb3b);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    
    .btn-mina {
      background: none;
      border: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn-mina:active {
      transform: scale(0.95);
    }

    @keyframes flotarGoku {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }

    .icono-mina-img {
      width: 380px;
      max-width: 90vw;
      height: auto;
      max-height: 42vh;
      object-fit: contain;
      margin-bottom: 2px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: drop-shadow(0 0 20px rgba(0, 255, 204, 0.3));
      animation: flotarGoku 4s ease-in-out infinite;
    }

    @keyframes flotar {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    .capsula-img {
      width: 280px;
      max-width: 82vw;
      height: auto;
      object-fit: contain;
      margin: 4px 0;
      filter: drop-shadow(0 0 15px rgba(0, 180, 255, 0.25));
      animation: flotar 3s ease-in-out infinite;
    }

    .texto-estado {
      font-size: 0.85rem;
      font-weight: bold;
      color: #00ffcc;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      margin-top: 2px;
    }

    .barra-contenedor {
      width: 80%;
      max-width: 240px;
      background: #222;
      border-radius: 8px;
      height: 8px;
      margin-top: 4px;
      overflow: hidden;
      border: 1px solid #444;
    }
    #barraProgreso {
      background: linear-gradient(90deg, #00b4db, #00ffcc);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    #textoProgreso {
      font-size: 0.7rem;
      color: #aaa;
      margin-top: 2px;
    }

    .capsula-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 340px;
    }

    .contador-capsula {
      font-size: 2.3rem;
      font-weight: 800;
      color: #00ffcc;
      margin: 2px 0 8px 0;
      font-family: monospace;
      text-shadow: 0 2px 10px rgba(0, 255, 204, 0.3);
      letter-spacing: 1px;
    }

    .btn-accion {
      background: linear-gradient(135deg, #00b4db, #0083b0);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }
    .btn-accion:active {
      transform: scale(0.97);
    }
    .btn-pago {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #121212;
    }

    #ton-connect-button {
      margin-top: 5px;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .amigos-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }
    .lista-amigos {
      max-height: 180px;
      overflow-y: auto;
      text-align: left;
      width: 100%;
      margin: 8px 0;
      font-size: 0.85rem;
      background: #181818;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333;
      box-sizing: border-box;
    }
    .amigo-item {
      padding: 5px 4px;
      border-bottom: 1px solid #2a2a2a;
      color: #00ffcc;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .menu-inferior {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 52px;
      background: #161616;
      border-top: 1px solid #282828;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .menu-item {
      background: none;
      border: none;
      color: #777;
      font-size: 0.7rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      flex: 1;
      height: 100%;
      justify-content: center;
      padding: 0;
      margin: 0;
      transition: color 0.2s;
    }
    .menu-item .menu-icono {
      font-size: 1.1rem;
      margin-bottom: 1px;
      line-height: 1;
    }
    .menu-item span:last-child {
      line-height: 1;
    }
    .menu-item.activo {
      color: #00ffcc;
      font-weight: bold;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-contenido {
      background: #1e1e1e;
      padding: 18px;
      border-radius: 14px;
      width: 85%;
      max-width: 270px;
      text-align: center;
      border: 1px solid #444;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }
    .modal-contenido p {
      margin-top: 0;
      font-size: 0.95rem;
      color: #ddd;
    }
    .btn-modal {
      background: #333;
      color: white;
      border: 1px solid #555;
      padding: 9px;
      border-radius: 8px;
      width: 100%;
      margin-top: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .btn-modal:active { background: #444; }
    .btn-cerrar {
      background: #b71c1c;
      border: none;
      margin-top: 12px;
    }

    .oculto { display: none !important; }
  </style>
</head>
<body>

  <button class="btn-demo-test" onclick="forzarAperturaDemo()">⚡ TEST ABRIR</button>

  <div class="contenido-principal">
    <div id="pantallaCapsula" class="capsula-container">
      <div class="titulo">Cápsula de Nacimiento</div>
      <img src="https://github.com/seokypunto/Juegopruebadbz/blob/main/assets/img/capsule.png?raw=true" class="capsula-img" alt="Cápsula">
      <div style="font-size: 0.75rem; color: #aaa; margin-top: 2px;">Tiempo restante para eclosionar:</div>
      <div id="relojCapsula" class="contador-capsula">48:00:00</div>
      <button class="btn-accion" onclick="abrirOpcionesReferido()">Invitar Amigo (-1 Hora)</button>
      <button class="btn-accion btn-pago" onclick="acelerarConTonWallet()">Acelerar con Inversión (TON)</button>
      <div id="ton-connect-button"></div>
    </div>

    <div id="pantallaMinero" class="oculto" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
      <div class="titulo">Balance Total</div>
      <div id="monedas">0</div>

      <div class="nivel-info-container">
        <div class="nivel-texto-fila">
          <span id="textoNivel">Nivel 1</span>
          <span id="textoExpPorc">0%</span>
        </div>
        <div class="barra-exp-contenedor">
          <div id="barraExp"></div>
        </div>
      </div>

      <button class="btn-mina" id="btnMina" onclick="recolectar()">
        <img src="https://github.com/seokypunto/Juegopruebadbz/blob/main/assets/img/goku-baby.png?raw=true" class="icono-mina-img" alt="Goku Baby">
        <div class="texto-estado" id="estadoTexto">Minando...</div>
      </button>

      <div class="barra-contenedor">
        <div id="barraProgreso"></div>
      </div>
      <div id="textoProgreso">Progreso: 0 / 1000</div>
    </div>

    <div id="pantallaAmigos" class="amigos-container oculto">
      <div class="titulo" style="margin-bottom: 4px;">Tus Amigos Invitados</div>
      <p style="font-size: 0.75rem; color: #aaa; margin-top: 0;">Gana bonificaciones invitando a tus compis de Telegram.</p>
      <div id="contenedorListaAmigos" class="lista-amigos">Cargando amigos...</div>
      <button class="btn-accion" onclick="abrirOpcionesReferido()">Compartir Enlace</button>
    </div>
  </div>

  <div class="menu-inferior">
    <button class="menu-item activo" id="navJuego" onclick="cambiarSeccion('juego')">
      <span class="menu-icono">⚡</span>
      <span>Mina</span>
    </button>
    <button class="menu-item" id="navAmigos" onclick="cambiarSeccion('amigos')">
      <span class="menu-icono">👥</span>
      <span>Amigos</span>
    </button>
  </div>

  <div id="modalReferido" class="modal-overlay oculto">
    <div class="modal-contenido">
      <p>¿Cómo quieres compartir tu enlace?</p>
      <button class="btn-modal" onclick="copiarEnlaceDirecto()">Copiar enlace</button>
      <button class="btn-modal" onclick="compartirTelegramDirecto()">Enviar a chat</button>
      <button class="btn-modal btn-cerrar" onclick="cerrarModalReferido()">Cancelar</button>
    </div>
  </div>

  <script>
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: 'https://seokypunto.github.io/Juegopruebadbz/tonconnect-manifest.json',
      buttonRootId: 'ton-connect-button'
    });

    var tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.expand(); }

    var usuario = (tg && tg.initDataUnsafe) ? tg.initDataUnsafe.user : null;

    var SUPABASE_URL = "https://jqxyxznxrfijwvvlzwqn.supabase.co";
    var SUPABASE_KEY = "sb_publishable_pN84HJ_JgrYxWRC4EDq_fA_ges02f51";

    var clientSupabase = null;
    try {
      if (window.supabase) {
        clientSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch(e) {}

    var tiempoRestanteSegundos = 48 * 3600; 
    var timestampFin = 0;
    var timerCapsula = null;
    var capsulaAbierta = false;

    var monedasTotales = 0;
    var progresoActual = 0;
    var limiteMinado = 1000;
    var nivelActual = 1;
    var expActual = 0;
    var expNecesaria = 5000;

    async function verificarYRegistrarUsuario() {
      if (!usuario || !clientSupabase) {
        iniciarContadorLocal(48 * 3600);
        return;
      }

      var ahora = Date.now();
      var startParam = (tg && tg.initDataUnsafe) ? (tg.initDataUnsafe.start_param || tg.initDataUnsafe.startapp) : null;
      var referrerId = null;

      if (startParam && startParam.startsWith("ref_")) {
        referrerId = parseInt(startParam.replace("ref_", ""));
        if (referrerId === usuario.id) referrerId = null; 
      }

      try {
        var res = await clientSupabase
          .from('jugadores')
          .select('*')
          .eq('telegram_id', usuario.id)
          .maybeSingle();

        if (res.data) {
          timestampFin = parseInt(res.data.capsula_fin || (ahora + 48 * 3600 * 1000));
          monedasTotales = res.data.monedas || 0;
          nivelActual = res.data.nivel || 1;
          expActual = res.data.exp || 0;
          progresoActual = res.data.progreso_minado || 0;

          // Verificar si la cápsula ya terminó su cuenta atrás global
          if (ahora >= timestampFin) {
            capsulaAbierta = true;
          }

          var ultimaActualizacionDb = parseInt(res.data.ultima_actualizacion || ahora);
          var segundosFuera = Math.floor((ahora - ultimaActualizacionDb) / 1000);

          // PROGRESO OFFLINE PASIVO (Solo si la cápsula ya está abierta)
          if (segundosFuera > 0 && capsulaAbierta) {
            var totalProgresoSimulado = progresoActual + segundosFuera;
            
            // Cuántas veces se ha llenado la barra entera mientras estabas fuera
            var ciclosCompletados = Math.floor(totalProgresoSimulado / limiteMinado);
            
            if (ciclosCompletados > 0) {
              // Si completó uno o más ciclos offline, sumamos las monedas automáticas
              monedasTotales += (ciclosCompletados * limiteMinado);
              expActual += (ciclosCompletados * 500); // Experiencia por cada ciclo completado

              // Subir niveles si procede
              while (expActual >= expNecesaria) {
                expActual -= expNecesaria;
                nivelActual++;
                expNecesaria = Math.floor(expNecesaria * 1.3);
              }

              // El progreso actual se queda con el sobrante del último ciclo incompleto
              progresoActual = totalProgresoSimulado % limiteMinado;
            } else {
              progresoActual = totalProgresoSimulado;
            }

            // Si se llenó exactamente o pasó de largo pero sin completar otro ciclo
            if (progresoActual >= limiteMinado) {
              progresoActual = limiteMinado;
            }
          }

          document.getElementById('monedas').innerText = monedasTotales;
          actualizarInterfazNivel();
          actualizarInterfazMinado();

          if (progresoActual >= limiteMinado) {
            document.getElementById('estadoTexto').innerText = "RECLAMAR";
            document.getElementById('estadoTexto').style.color = "#ffd700";
          }

          if (capsulaAbierta) {
            eclosionarCapsula();
          } else {
            var segundosRestantes = Math.floor((timestampFin - ahora) / 1000);
            if (segundosRestantes <= 0) {
              eclosionarCapsula();
            } else {
              iniciarContadorLocal(segundosRestantes);
            }
          }

          // Guardar el nuevo estado actualizado tras el cálculo offline en Supabase
          actualizarSupabaseProgreso();
        } else {
          timestampFin = ahora + (48 * 3600 * 1000);
          monedasTotales = 0;
          nivelActual = 1;
          expActual = 0;
          progresoActual = 0;

          document.getElementById('monedas').innerText = 0;
          actualizarInterfazNivel();
          actualizarInterfazMinado();

          iniciarContadorLocal(48 * 3600);

          await clientSupabase.from('jugadores').upsert({
            telegram_id: usuario.id,
            username: usuario.username || 'sin_nombre',
            monedas: 0,
            nivel: 1,
            exp: 0,
            progreso_minado: 0,
            capsula_fin: timestampFin,
            ultima_actualizacion: ahora
          }, { onConflict: 'telegram_id' });

          if (referrerId) {
            try {
              var resCheckRef = await clientSupabase
                .from('referidos')
                .select('*')
                .eq('referido_id', usuario.id)
                .maybeSingle();

              if (!resCheckRef.data) {
                await clientSupabase.from('referidos').insert({
                  referrer_id: referrerId,
                  referido_id: usuario.id
                });
              }
            } catch (errRef) {}
          }
        }
      } catch (e) {
        iniciarContadorLocal(48 * 3600);
      }
    }

    function iniciarContadorLocal(segundosIniciales) {
      tiempoRestanteSegundos = segundosIniciales;
      if (timerCapsula) clearInterval(timerCapsula);

      timerCapsula = setInterval(function() {
        if (tiempoRestanteSegundos <= 0) {
          eclosionarCapsula();
          return;
        }
        
        var horas = Math.floor(tiempoRestanteSegundos / 3600);
        var minutos = Math.floor((tiempoRestanteSegundos % 3600) / 60);
        var segundos = tiempoRestanteSegundos % 60;

        document.getElementById('relojCapsula').innerText = 
          (horas < 10 ? "0" : "") + horas + ":" + 
          (minutos < 10 ? "0" : "") + minutos + ":" + 
          (segundos < 10 ? "0" : "") + segundos;
        
        tiempoRestanteSegundos--;
      }, 1000);
    }

    async function actualizarSupabaseProgreso() {
      if (!usuario || !clientSupabase) return;
      try {
        await clientSupabase.from('jugadores').upsert({
          telegram_id: usuario.id,
          username: usuario.username || 'sin_nombre',
          monedas: monedasTotales,
          nivel: nivelActual,
          exp: expActual,
          progreso_minado: progresoActual,
          capsula_fin: timestampFin,
          ultima_actualizacion: Date.now()
        }, { onConflict: 'telegram_id' });
      } catch (e) {}
    }

    async function acelerarConTonWallet() {
      if (!tonConnectUI.connected) {
        try {
          await tonConnectUI.openModal();
          return;
        } catch (error) {
          alert("Debes conectar tu wallet TON para realizar la inversión.");
          return;
        }
      }

      const transaction = {
        validUntil: Math.floor(Date.now() / 1000) + 360,
        messages: [
          {
            address: "UQCW6jcBFyTr5rM6hLIh30VQGNP9vKKHqMFYv1nqpz1fe2WX",
            amount: "500000000"
          }
        ]
      };

      try {
        const result = await tonConnectUI.sendTransaction(transaction);
        timestampFin -= (12 * 3600 * 1000);
        var ahora = Date.now();
        var segundosRestantes = Math.floor((timestampFin - ahora) / 1000);
        if (segundosRestantes <= 0) {
          eclosionarCapsula();
        } else {
          iniciarContadorLocal(segundosRestantes);
        }
        actualizarSupabaseProgreso();
        alert("¡Inversión exitosa! Tu cápsula ha acelerado su eclosión.");
      } catch (e) {
        alert("Transacción cancelada o error en la red TON.");
      }
    }

    function forzarAperturaDemo() {
      tiempoRestanteSegundos = 0;
      timestampFin = Date.now();
      eclosionarCapsula();
      actualizarSupabaseProgreso();
    }

    function cambiarSeccion(seccion) {
      document.getElementById('navJuego').classList.remove('activo');
      document.getElementById('navAmigos').classList.remove('activo');

      document.getElementById('pantallaAmigos').classList.add('oculto');
      if (!capsulaAbierta) {
        document.getElementById('pantallaCapsula').classList.add('oculto');
      } else {
        document.getElementById('pantallaMinero').classList.add('oculto');
      }

      if (seccion === 'juego') {
        document.getElementById('navJuego').classList.add('activo');
        if (!capsulaAbierta) {
          document.getElementById('pantallaCapsula').classList.remove('oculto');
        } else {
          document.getElementById('pantallaMinero').classList.remove('oculto');
        }
      } else if (seccion === 'amigos') {
        document.getElementById('navAmigos').classList.add('activo');
        document.getElementById('pantallaAmigos').classList.remove('oculto');
        cargarListaAmigos();
      }
    }

    function abrirOpcionesReferido() {
      if (!usuario) {
        alert("Error: Debes abrir este juego desde Telegram.");
        return;
      }
      document.getElementById('modalReferido').classList.remove('oculto');
    }

    function cerrarModalReferido() {
      document.getElementById('modalReferido').classList.add('oculto');
    }

    async function cargarListaAmigos() {
      var contenedor = document.getElementById('contenedorListaAmigos');
      if (!usuario || !clientSupabase) {
        contenedor.innerHTML = "Disponible solo en línea.";
        return;
      }

      contenedor.innerHTML = "Cargando amigos...";

      try {
        var resRef = await clientSupabase
          .from('referidos')
          .select('referido_id')
          .eq('referrer_id', usuario.id);

        if (resRef.error) {
          contenedor.innerHTML = "Error al consultar referidos.";
          return;
        }

        var referidos = resRef.data || [];
        if (referidos.length === 0) {
          contenedor.innerHTML = "Aún no has invitado a ningún amigo.";
          return;
        }

        var idsReferidos = referidos.map(function(r) { return r.referido_id; });

        var resJugadores = await clientSupabase
          .from('jugadores')
          .select('username, telegram_id')
          .in('telegram_id', idsReferidos);

        var listaJugadores = resJugadores.data || [];
        if (listaJugadores.length === 0) {
          contenedor.innerHTML = "No se encontraron detalles de los amigos.";
          return;
        }

        var htmlLista = "";
        for (var i = 0; i < listaJugadores.length; i++) {
          var nombre = listaJugadores[i].username || ("Usuario " + listaJugadores[i].telegram_id);
          htmlLista += '<div class="amigo-item">👤 ' + nombre + '</div>';
        }
        contenedor.innerHTML = htmlLista;

      } catch (e) {
        contenedor.innerHTML = "Error de conexión con la base de datos.";
      }
    }

    function obtenerEnlaceRef() {
      if (!usuario) return "";
      var botName = "seoky_tapbot"; 
      return "https://t.me/" + botName + "?startapp=ref_" + usuario.id;
    }

    function copiarEnlaceDirecto() {
      var enlaceRef = obtenerEnlaceRef();
      if (!enlaceRef) return;

      navigator.clipboard.writeText(enlaceRef).then(function() {
        alert("Enlace copiado con éxito.");
        cerrarModalReferido();
      }).catch(function(err) {
        prompt("Copia tu enlace:", enlaceRef);
        cerrarModalReferido();
      });
    }

    function compartirTelegramDirecto() {
      var enlaceRef = obtenerEnlaceRef();
      if (!enlaceRef) return;

      var textoMensaje = "¡Únete a mi cápsula en Criptomaniakos Miner!";
      var enlaceShare = "https://t.me/share/url?url=" + encodeURIComponent(enlaceRef) + "&text=" + encodeURIComponent(textoMensaje);

      cerrarModalReferido();

      if (tg && typeof tg.openTelegramLink === 'function') {
        tg.openTelegramLink(enlaceShare);
      } else {
        window.open(enlaceShare, '_blank');
      }
    }

    if (clientSupabase) {
      verificarYRegistrarUsuario();
    } else {
      iniciarContadorLocal(48 * 3600);
    }

    function eclosionarCapsula() {
      capsulaAbierta = true;
      if (timerCapsula) clearInterval(timerCapsula);
      
      var navActivo = document.getElementById('navJuego').classList.contains('activo');
      if (navActivo) {
        document.getElementById('pantallaCapsula').classList.add('oculto');
        document.getElementById('pantallaMinero').classList.remove('oculto');
      }

      if (progresoActual >= limiteMinado) {
        document.getElementById('estadoTexto').innerText = "RECLAMAR";
        document.getElementById('estadoTexto').style.color = "#ffd700";
      }
    }

    // Bucle de minado en tiempo real (cuando la app está abierta)
    setInterval(function() {
      var navActivo = document.getElementById('navJuego').classList.contains('activo');
      if (capsulaAbierta && navActivo) {
        if (progresoActual < limiteMinado) {
          progresoActual++;
          actualizarInterfazMinado();

          if (progresoActual === limiteMinado) {
            document.getElementById('estadoTexto').innerText = "RECLAMAR";
            document.getElementById('estadoTexto').style.color = "#ffd700";
            actualizarSupabaseProgreso();
          }
        }
      }
    }, 1000);

    // Guardado automático cada 5 segundos en segundo plano si la app sigue abierta
    setInterval(function() {
      if (capsulaAbierta) {
        actualizarSupabaseProgreso();
      }
    }, 5000);

    // Eventos para guardar inmediatamente si el usuario minimiza, oculta o cierra la pestaña/app
    window.addEventListener('beforeunload', function() {
      actualizarSupabaseProgreso();
    });

    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'hidden') {
        actualizarSupabaseProgreso();
      }
    });

    function actualizarInterfazMinado() {
      document.getElementById('barraProgreso').style.width = (progresoActual / limiteMinado) * 100 + '%';
      document.getElementById('textoProgreso').innerText = 'Progreso: ' + progresoActual + ' / ' + limiteMinado;
    }

    function actualizarInterfazNivel() {
      document.getElementById('textoNivel').innerText = 'Nivel ' + nivelActual;
      var porcentajeExp = Math.floor((expActual / expNecesaria) * 100);
      document.getElementById('textoExpPorc').innerText = porcentajeExp + '%';
      document.getElementById('barraExp').style.width = porcentajeExp + '%';
    }

    function recolectar() {
      if (progresoActual < limiteMinado) return;

      monedasTotales += limiteMinado;
      expActual += 500; 

      if (expActual >= expNecesaria) {
        expActual -= expNecesaria;
        nivelActual++;
        expNecesaria = Math.floor(expNecesaria * 1.3);
        alert("¡Felicidades! Goku baby ha subido al Nivel " + nivelActual);
      }

      document.getElementById('monedas').innerText = monedasTotales;
      actualizarInterfazNivel();

      progresoActual = 0;
      document.getElementById('estadoTexto').innerText = "Minando...";
      document.getElementById('estadoTexto').style.color = "#00ffcc";
      actualizarInterfazMinado();

.      actualizarSupabaseProgreso();
    }
  </script>
</body>
</html>
