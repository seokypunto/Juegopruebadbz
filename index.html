<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criptomaniakos Miner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      user-select: none;
    }
    .titulo {
      font-size: 1rem;
      color: #888;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #monedas {
      font-size: 3.5rem;
      font-weight: bold;
      margin-bottom: 20px;
      color: #ffd700;
    }
    
    .btn-mina {
      background: none;
      border: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn-mina:active {
      transform: scale(0.95);
    }

    .icono-mina-img {
      width: 280px;
      height: 280px;
      object-fit: contain;
      margin-bottom: 15px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .texto-estado {
      font-size: 1.2rem;
      font-weight: bold;
      color: #00ffcc;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .barra-contenedor {
      width: 80%;
      max-width: 280px;
      background: #222;
      border-radius: 10px;
      height: 16px;
      margin-top: 30px;
      overflow: hidden;
      border: 1px solid #444;
    }
    #barraProgreso {
      background: linear-gradient(90deg, #ff9800, #ffeb3b);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    #textoProgreso {
      font-size: 0.9rem;
      color: #aaa;
      margin-top: 10px;
    }

    .capsula-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 90%;
      max-width: 320px;
    }
    .contador-capsula {
      font-size: 2.5rem;
      font-weight: bold;
      color: #00ffcc;
      margin: 15px 0;
      font-family: monospace;
    }
    .btn-accion {
      background: linear-gradient(135deg, #00b4db, #0083b0);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }
    .btn-accion:active {
      transform: scale(0.97);
    }
    .btn-pago {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #121212;
    }

    .oculto { display: none !important; }
    #log { display: none; }
  </style>
</head>
<body>

  <!-- ================= PANTALLA 1: LA CÁPSULA ================= -->
  <div id="pantallaCapsula" class="capsula-container">
    <div class="titulo">Cápsula de Nacimiento</div>
    
    <img src="https://github.com/seokypunto/Juegopruebadbz/blob/main/assets/img/capsule.png?raw=true" class="icono-mina-img" alt="Cápsula">
    
    <div style="font-size: 0.9rem; color: #bbb;">Tiempo restante para eclosionar:</div>
    <div id="relojCapsula" class="contador-capsula">48:00:00</div>

    <button class="btn-accion" onclick="abrirOpcionesReferido()">👥 Invitar Amigo (-1 Hora)</button>
    <button class="btn-accion btn-pago" onclick="acelerarPago()">⚡ Acelerar con Inversión</button>
  </div>


  <!-- ================= PANTALLA 2: EL MINERO ================= -->
  <div id="pantallaMinero" class="oculto" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
    <div class="titulo">Balance Total</div>
    <div id="monedas">0</div>

    <button class="btn-mina" id="btnMina" onclick="recolectar()">
      <img src="https://raw.githubusercontent.com/seokypunto/Juegopruebadbz/main/assets/img/vegeta-blue.png?raw=true" class="icono-mina-img" alt="Vegeta Blue">
      <div class="texto-estado" id="estadoTexto">Minando...</div>
    </button>

    <div class="barra-contenedor">
      <div id="barraProgreso"></div>
    </div>
    <div id="textoProgreso">Progreso: 0 / 1000</div>
  </div>

  <div id="log">=== CONSOLA ===</div>

  <script>
    function logger(txt) {
      var elem = document.getElementById('log');
      if (elem) {
        elem.innerHTML += '<br>> ' + txt;
        elem.scrollTop = elem.scrollHeight;
      }
    }

    var tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.expand(); }

    var usuario = (tg && tg.initDataUnsafe) ? tg.initDataUnsafe.user : null;

    var SUPABASE_URL = "https://jqxyxznxrfijwvvlzwqn.supabase.co";
    var SUPABASE_KEY = "sb_publishable_pN84HJ_JgrYxWRC4EDq_fA_ges02f51";

    var clientSupabase = null;
    try {
      if (window.supabase) {
        clientSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch(e) {}

    // --- LÓGICA DE LA CÁPSULA (48 Horas) ---
    var tiempoRestanteSegundos = 48 * 3600; 

    function actualizarRelojCapsula() {
      if (tiempoRestanteSegundos <= 0) {
        eclosionarCapsula();
        return;
      }
      
      var horas = Math.floor(tiempoRestanteSegundos / 3600);
      var minutos = Math.floor((tiempoRestanteSegundos % 3600) / 60);
      var segundos = tiempoRestanteSegundos % 60;

      document.getElementById('relojCapsula').innerText = 
        (horas < 10 ? "0" : "") + horas + ":" + 
        (minutos < 10 ? "0" : "") + minutos + ":" + 
        (segundos < 10 ? "0" : "") + segundos;
      
      tiempoRestanteSegundos--;
    }

    var timerCapsula = setInterval(actualizarRelojCapsula, 1000);

    // --- SISTEMA DE REFERIDOS DIRECTO (@seoky_tapbot) ---
    function abrirOpcionesReferido() {
      if (!usuario) {
        alert("Error: Debes abrir este juego desde Telegram para generar tu enlace.");
        return;
      }
      
      var botName = "seoky_tapbot"; 
      var enlaceRef = "https://t.me/" + botName + "?startapp=ref_" + usuario.id;

      navigator.clipboard.writeText(enlaceRef).then(function() {
        alert("¡Enlace de referido copiado con éxito!\n\n" + enlaceRef);
      }).catch(function(err) {
        prompt("Copia tu enlace de invitado:", enlaceRef);
      });
    }

    async function verificarReferidoEntrante() {
      if (!usuario || !clientSupabase) return;
      
      var startParam = (tg && tg.initDataUnsafe) ? (tg.initDataUnsafe.start_param || tg.initDataUnsafe.startapp) : null;
      if (!startParam || !startParam.startsWith("ref_")) return;

      var referrerId = startParam.replace("ref_", "");
      if (referrerId == usuario.id) return; // Evitar auto-referidos

      try {
        var resCheck = await clientSupabase
          .from('referidos')
          .select('*')
          .eq('referido_id', usuario.id)
          .maybeSingle();

        if (resCheck.data) return; 

        await clientSupabase.from('referidos').insert({
          referrer_id: parseInt(referrerId),
          referido_id: usuario.id
        });

        logger('¡Registrado con éxito mediante referido de: ' + referrerId);
      } catch(e) {
        logger('Error procesando referido: ' + e.message);
      }
    }

    if (clientSupabase) {
      verificarReferidoEntrante();
    }

    function acelerarPago() {
      tiempoRestanteSegundos -= 12 * 3600; 
      if (tiempoRestanteSegundos < 0) tiempoRestanteSegundos = 0;
      actualizarRelojCapsula();
      logger('⚡ ¡Inversión aplicada! Aceleración de cápsula.');
    }

    function eclosionarCapsula() {
      clearInterval(timerCapsula);
      document.getElementById('pantallaCapsula').classList.add('oculto');
      document.getElementById('pantallaMinero').classList.remove('oculto');
      logger('¡La cápsula ha eclosionado! Comienza el minado.');
    }


    // --- LÓGICA DEL MINERO ---
    var monedasTotales = 0;
    var progresoActual = 0;
    var limiteMinado = 1000;

    setInterval(function() {
      if (!document.getElementById('pantallaMinero').classList.contains('oculto')) {
        if (progresoActual < limiteMinado) {
          progresoActual++;
          actualizarInterfazMinado();

          if (progresoActual === limiteMinado) {
            document.getElementById('estadoTexto').innerText = "¡RECLAMAR!";
            document.getElementById('estadoTexto').style.color = "#ffd700";
          }
        }
      }
    }, 1000);

    function actualizarInterfazMinado() {
      document.getElementById('barraProgreso').style.width = (progresoActual / limiteMinado) * 100 + '%';
      document.getElementById('textoProgreso').innerText = 'Progreso: ' + progresoActual + ' / ' + limiteMinado;
    }

    function recolectar() {
      if (progresoActual < limiteMinado) {
        logger('Aún no está lleno, espera a que termine de minar.');
        return;
      }

      monedasTotales += limiteMinado;
      document.getElementById('monedas').innerText = monedasTotales;

      progresoActual = 0;
      document.getElementById('estadoTexto').innerText = "Minando...";
      document.getElementById('estadoTexto').style.color = "#00ffcc";
      actualizarInterfazMinado();

      logger('¡Recogido! Total: ' + monedasTotales);

      if (!usuario || !clientSupabase) return;

      clientSupabase
        .from('jugadores')
        .upsert({ 
          telegram_id: usuario.id, 
          username: usuario.username || 'sin_nombre', 
          monedas: monedasTotales 
        })
        .then(function(res) {
          if (res.error) logger('Error BD: ' + res.error.message);
        });
    }
  </script>
</body>
</html>
